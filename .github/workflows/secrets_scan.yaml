name: Security - Secret Scan

on:
  push:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_COMMITS: ${{ toJson(github.event.commits) }}
          REF_NAME: ${{ github.ref_name }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$EVENT_NAME" == "push" ]; then
            echo "depth=$(($(jq length <<< "$PUSH_COMMITS") + 2))" >> "$GITHUB_ENV"
            echo "branch=$REF_NAME" >> "$GITHUB_ENV"
          fi
          if [ "$EVENT_NAME" == "pull_request" ]; then
            echo "depth=$(($PR_COMMITS+2))" >> "$GITHUB_ENV"
            echo "branch=$PR_HEAD_REF" >> "$GITHUB_ENV"
          fi
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{env.branch}}
          fetch-depth: ${{env.depth}}
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
