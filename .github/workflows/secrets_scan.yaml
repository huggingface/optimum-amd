name: Security - Secret Scan

on:
  push:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
          REF_NAME: ${{ github.ref_name }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$EVENT_NAME" == "push" ]; then
            echo "depth=$(($(jq length <<< "$COMMITS_JSON") + 2))" >> "$GITHUB_ENV"
            echo "branch=$REF_NAME" >> "$GITHUB_ENV"
          fi
          if [ "$EVENT_NAME" == "pull_request" ]; then
            echo "depth=$(( ${PR_COMMITS:-0} + 2 ))" >> "$GITHUB_ENV"
            echo "branch=$PR_HEAD_REF" >> "$GITHUB_ENV"
          fi
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{env.branch}}
          fetch-depth: ${{env.depth}}
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
