name: Brevitas / Python - Test

on:
  push:
    branches: [ main ]
    paths:
      - "optimum/amd/brevitas/**/*.py"
      - "tests/brevitas/*.py"
      - ".github/workflows/test_brevitas.yaml"
  pull_request:
    branches: [ main ]
    paths:
      - "optimum/amd/brevitas/**/*.py"
      - "tests/brevitas/*.py"
      - ".github/workflows/test_brevitas.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.9]
        os: [ubuntu-20.04, windows-2019, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2.3.4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install git+https://github.com/Xilinx/brevitas.git@dev

        pip install .[brevitas,tests]

    - name: Test with pytest
      run: |
        pytest tests/brevitas -s -vvvvv --durations=0
